name: knowoff_client
description: Knowoff Flutter client — Android, iOS, and Web PWA.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  web_socket_channel: ^3.0.1
  http: ^1.2.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.3
  file_selector: 1.0.3
  qr_flutter: 4.1.0
  url_launcher: 6.3.2
  in_app_purchase: 3.3.0
  in_app_purchase_android: 0.5.3
  in_app_purchase_storekit: 0.4.13
  google_mobile_ads: 9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: 1.3.3
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config.json
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
