name: knowoff

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./config/postgres/environment.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowoff -d knowoff"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    profiles: [core, tools, test, edge]

  redis:
    image: redis:7-alpine
    env_file:
      - ./config/redis/environment.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$KNOWOFF_REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$KNOWOFF_REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"
    profiles: [core, tools, test, edge]

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    env_file:
      - ./config/minio/environment.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    profiles: [core, tools, test, edge]

  migrate:
    build:
      context: ../../server
      dockerfile: Dockerfile
    env_file:
      - ./config/migrate/environment.env
    volumes:
      - ../../configs:/app/configs:ro
      - ../../server/migrations:/migrations:ro
      - ../../content/packs:/data/packs:ro
      - ../../content/ingest:/data/ingest:ro
    entrypoint: ["/knowoffd", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, tools, test, edge]

  # One-off dev login seeder — never starts with `up`; run explicitly via
  # `make server.seed-admin`. Overrides: KNOWOFF_SEED_ADMIN_EMAIL / _PASSWORD.
  seed-admin:
    build:
      context: ../../server
      dockerfile: Dockerfile
    env_file:
      - ./config/seed-admin/environment.env
    environment:
      - KNOWOFF_SEED_ADMIN_EMAIL
      - KNOWOFF_SEED_ADMIN_PASSWORD
    volumes:
      - ../../configs:/app/configs:ro
    entrypoint: ["/knowoffd", "seed-admin"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]

  server:
    build:
      context: ../../server
      dockerfile: Dockerfile.dev
    env_file:
      - ./config/server/environment.env
    volumes:
      - ../../server:/app
      - ../../configs:/app/configs:ro
      - ../../content/packs:/data/packs:ro
      - ../../content/ingest:/data/ingest:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: [core, tools, test, edge]

  adminer:
    image: adminer:4
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, edge]

  client-web:
    build:
      context: ../../client
      dockerfile: Dockerfile.dev
    volumes:
      - ../../client:/app
    profiles: [core, edge]

  nginx:
    build:
      context: ../../nginx
      dockerfile: Dockerfile
    volumes:
      - ../../nginx/certs:/etc/nginx/certs
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      server:
        condition: service_started
      client-web:
        condition: service_started
      adminer:
        condition: service_started
      minio:
        condition: service_healthy
    profiles: [core, edge]

  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file:
      - ./config/cloudflared/environment.env
    command: ["tunnel", "--no-autoupdate", "run", "--token", "$$KNOWOFF_TUNNEL_TOKEN"]
    depends_on:
      server:
        condition: service_started
    profiles: [edge]

volumes:
  pg_data:
  redis_data:
  minio_data:
