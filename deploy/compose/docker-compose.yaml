name: knowoff

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowoff
      POSTGRES_PASSWORD: ${KNOWOFF_DB_PASSWORD:-knowoff}
      POSTGRES_DB: knowoff
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowoff -d knowoff"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    profiles: [core, tools, test, edge]

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${KNOWOFF_REDIS_PASSWORD:-knowoff}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${KNOWOFF_REDIS_PASSWORD:-knowoff}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"
    profiles: [core, tools, test, edge]

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${KNOWOFF_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${KNOWOFF_STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    profiles: [core, tools, test, edge]

  migrate:
    build:
      context: ../../server
      dockerfile: Dockerfile
    environment:
      KNOWOFF_CONFIG: /app/configs/local.yaml
      KNOWOFF_DB_PASSWORD: ${KNOWOFF_DB_PASSWORD:-knowoff}
      KNOWOFF_REDIS_PASSWORD: ${KNOWOFF_REDIS_PASSWORD:-knowoff}
      KNOWOFF_STORAGE_ACCESS_KEY: ${KNOWOFF_STORAGE_ACCESS_KEY:-minioadmin}
      KNOWOFF_STORAGE_SECRET_KEY: ${KNOWOFF_STORAGE_SECRET_KEY:-minioadmin}
      KNOWOFF_JWT_KEY: ${KNOWOFF_JWT_KEY:-dev-jwt-key-change-in-prod}
    volumes:
      - ../../configs:/app/configs:ro
      - ../../server/migrations:/migrations:ro
    entrypoint: ["/knowoffd", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, tools, test, edge]

  server:
    build:
      context: ../../server
      dockerfile: Dockerfile.dev
    environment:
      KNOWOFF_CONFIG: /app/configs/local.yaml
      KNOWOFF_DB_PASSWORD: ${KNOWOFF_DB_PASSWORD:-knowoff}
      KNOWOFF_REDIS_PASSWORD: ${KNOWOFF_REDIS_PASSWORD:-knowoff}
      KNOWOFF_STORAGE_ACCESS_KEY: ${KNOWOFF_STORAGE_ACCESS_KEY:-minioadmin}
      KNOWOFF_STORAGE_SECRET_KEY: ${KNOWOFF_STORAGE_SECRET_KEY:-minioadmin}
      KNOWOFF_JWT_KEY: ${KNOWOFF_JWT_KEY:-dev-jwt-key-change-in-prod}
    volumes:
      - ../../server:/app
      - ../../configs:/app/configs:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: [core, tools, test, edge]

  adminer:
    image: adminer:4
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, edge]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${KNOWOFF_TUNNEL_TOKEN}
    environment:
      KNOWOFF_TUNNEL_TOKEN: ${KNOWOFF_TUNNEL_TOKEN}
    depends_on:
      server:
        condition: service_started
    profiles: [edge]

volumes:
  pg_data:
  redis_data:
  minio_data:
