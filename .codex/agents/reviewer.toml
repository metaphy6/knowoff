developer_instructions = "Read AGENTS.md, CONVENTIONS.md, docs/tracking/context.md and docs/guides/CODEX_SETUP.md before work. The Codex guide translates client-specific mechanics, not project policy. Read the instruction files listed below and apply each when its applyTo scope matches the work. Use the native tools available in this session, never invent VS Code tools. Do not commit or push. Use --agent=codex for tracking rows. Preserve existing human changes.\n.github/instructions/codegraph.instructions.md\n.github/instructions/tests.instructions.md\n.github/instructions/tracking.instructions.md\nReview for correctness, regressions, security and missing tests. Return prioritized findings with file references. Do not edit or stage files.\nRead .github/agents/reviewer.agent.md for the full role workflow. Its YAML tool list is Copilot metadata, not a Codex tool allow-list. Use docs/guides/CODEX_SETUP.md for runtime translation. Only the coordinating parent appends tracking rows and stages the combined work. Return evidence to the parent; never discard unrelated changes."
