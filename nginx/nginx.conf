# Knowoff local reverse proxy — main nginx config.
# Performance defaults tuned for a single dev-machine deployment; every
# vhost lives in conf.d/*.conf and is loaded via the include below.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

# Matches the `ulimits.nofile` raised in infra/compose/docker-compose.yaml —
# without this, workers inherit whatever the container's default open-file
# limit was (1024), which caps concurrent proxied connections far below
# worker_connections below (each proxied WebSocket holds 2 fds).
worker_rlimit_nofile 65536;

events {
    # Aggregate capacity is worker_processes (auto = 1/host core) x this
    # value; each proxied WebSocket consumes 2 (client + upstream leg).
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Never advertise the exact nginx version.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                     'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # Local dev payloads (media pack assets, avatar uploads) can be a few MB.
    client_max_body_size 32m;
    client_body_buffer_size 128k;

    # Compression for text/JSON responses; media assets are already compressed
    # (WebP/animated WebP) so they are not in this list.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Proxy buffering tuned for small JSON/WS frames, not large file transfer.
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_connect_timeout 10s;

    # Rate limiting zones, applied per-vhost where it makes sense (see conf.d).
    # Sized generously for local dev/multi-tab testing — not a production policy.
    limit_req_zone $binary_remote_addr zone=knowoff_general:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=knowoff_conn:10m;

    # Shared upstream keepalive pools — avoids a new TCP connection per request
    # to the same backend, the single biggest win for local request latency.
    upstream knowoff_server {
        server server:8080;
        keepalive 32;
    }

    upstream knowoff_admin {
        server server:9090;
        keepalive 8;
    }

    upstream knowoff_client_web {
        server client-web:8000;
        keepalive 16;
    }

    upstream knowoff_adminer {
        server adminer:8080;
        keepalive 8;
    }

    upstream knowoff_minio_console {
        server minio:9001;
        keepalive 8;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Vhost files are included explicitly (not via *.conf glob) because
    # conf.d/00-security-headers.conf is a per-server-block snippet, not a
    # standalone server: `add_header` does not merge across nesting levels
    # in nginx, so it must be `include`-d *inside* each vhost's server
    # block (see conf.d/*.knowoff.local.conf) rather than loaded here at
    # the http level, where it would be silently discarded by any vhost
    # that also sets its own add_header (e.g. a per-vhost CSP).
    include /etc/nginx/conf.d/api.knowoff.local.conf;
    include /etc/nginx/conf.d/app.knowoff.local.conf;
    include /etc/nginx/conf.d/admin.knowoff.local.conf;
    include /etc/nginx/conf.d/adminer.knowoff.local.conf;
    include /etc/nginx/conf.d/minio.knowoff.local.conf;
}
