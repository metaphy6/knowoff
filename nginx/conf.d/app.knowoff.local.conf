# app.knowoff.local — proxies to the Flutter web client (dev: client-web's
# `flutter run -d web-server`; see ../../infra/compose/docker-compose.yaml).
#
# The Content-Security-Policy here is intentionally more permissive than
# api./admin.knowoff.local: Flutter's web engine compiles/executes WASM
# (CanvasKit/Skia, and skwasm on newer renderers) via workers, which needs
# 'wasm-unsafe-eval' and worker-src blob:. If your build's devtools console
# still logs CSP violations, tighten or loosen script-src to match your
# renderer (canvaskit vs skwasm) rather than removing the header.
#
# https://www.gstatic.com is allow-listed in script-src/connect-src because
# Flutter's default web build fetches CanvasKit (canvaskit.js/.wasm) from
# Google's CDN rather than bundling it — a real external dependency, but an
# acceptable one for this dev-only proxy (see client/Dockerfile.dev if you
# want to switch to a locally-bundled renderer instead). connect-src also
# allows https://fonts.gstatic.com: the Flutter web engine falls back to
# fetching Roboto/Noto Sans Symbols glyphs from there for any codepoint the
# app's own bundled fonts don't cover, independent of app theming.
#
# script-src also carries 'unsafe-inline': flutter_bootstrap.js injects a
# small inline <script> at runtime (not just external src= tags). Its exact
# content — and thus its CSP hash — changes across Flutter SDK/build
# versions, so a pinned sha256 hash would silently break on every upgrade;
# 'unsafe-inline' is dropped in favor of a hash automatically wherever one
# is present, so this only matters for this one Flutter-generated snippet.
server {
    listen 80;
    server_name app.knowoff.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.knowoff.local;

    ssl_certificate     /etc/nginx/certs/active/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:app_ssl:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/00-security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://api.knowoff.local wss://api.knowoff.local http://localhost:8080 ws://localhost:8080 https://www.gstatic.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Use Docker's embedded DNS server so client-web host resolution is dynamic.
    # Allows nginx to start up cleanly even when client-web container is disabled.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        # Flutter's dev-mode incremental compiler (DDC/DWDS) serves one
        # .dart.lib.js chunk per library and a cold page load can request
        # several hundred of them in a burst far above the shared 100-request
        # default — exceeding it returns nginx's own 503 HTML error page,
        # which the browser then (correctly) refuses to execute as a script.
        limit_req zone=knowoff_general burst=2000 nodelay;
        set $client_web_upstream "http://client-web:8000";
        proxy_pass $client_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
