# admin.knowoff.local — proxies to the Go server's internal admin port
# (9090): the Admin Console, Contributor Portal admin routes, and the
# dev-only Media Workbench. Per the BLUEPRINT (🛡️ Admin Console), this
# surface is never exposed through the *public* Cloudflare ingress — this
# vhost only exists so the local dev machine can reach it over a friendly
# name instead of a raw port, bound to 127.0.0.1 like every other service
# in deploy/compose/docker-compose.yaml.

server {
    listen 80;
    server_name admin.knowoff.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.knowoff.local;

    ssl_certificate     /etc/nginx/certs/active/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:admin_ssl:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/00-security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        limit_req zone=knowoff_general burst=50 nodelay;
        proxy_pass http://knowoff_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Admin session cookies must never be cached by an intermediary.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
}
