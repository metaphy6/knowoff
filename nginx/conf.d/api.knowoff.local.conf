# api.knowoff.local — proxies to the Go game server's public port (8080):
# REST endpoints (/healthz, /readyz, auth, profile, economy, portal, ...)
# and the /ws WebSocket upgrade. Pure JSON + WebSocket, no HTML — so the
# Content-Security-Policy here can be maximally strict.

server {
    listen 80;
    server_name api.knowoff.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.knowoff.local;

    ssl_certificate     /etc/nginx/certs/active/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:api_ssl:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/00-security-headers.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    limit_conn knowoff_conn 100;

    # WebSocket upgrade — long-lived connections, no request-rate limiting.
    location /ws {
        proxy_pass http://knowoff_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        limit_req zone=knowoff_general burst=100 nodelay;
        proxy_pass http://knowoff_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
