# adminer.knowoff.local — convenience proxy to the `adminer` dev container
# (Postgres browser UI). Adminer ships its own inline <script>/<style>
# markup, so a strict Content-Security-Policy here would break its UI;
# this vhost intentionally omits CSP and keeps only the headers that don't
# conflict with a third-party tool's markup. See docs/guides/DEV_CREDENTIALS.md
# for the login (server = postgres, from deploy/compose/config/postgres/environment.env).

server {
    listen 80;
    server_name adminer.knowoff.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name adminer.knowoff.local;

    ssl_certificate     /etc/nginx/certs/active/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:adminer_ssl:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/00-security-headers.conf;

    location / {
        limit_req zone=knowoff_general burst=50 nodelay;
        proxy_pass http://knowoff_adminer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
