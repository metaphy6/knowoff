# minio.knowoff.local — convenience proxy to the MinIO console (bucket
# browser UI, port 9001). MinIO's console is a bundled SPA with its own
# inline/hashed script tags, so — like adminer.knowoff.local — this vhost
# omits Content-Security-Policy rather than fight the third-party bundle.
# The S3 API port (9000) is intentionally not proxied here: the client and
# server both address it directly (see configs/*.yaml storage.endpoint),
# and proxying signed S3 requests through an extra hostname would change
# the signature's Host header and break them.

server {
    listen 80;
    server_name minio.knowoff.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name minio.knowoff.local;

    ssl_certificate     /etc/nginx/certs/active/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:minio_ssl:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/00-security-headers.conf;

    location / {
        limit_req zone=knowoff_general burst=50 nodelay;
        proxy_pass http://knowoff_minio_console;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
