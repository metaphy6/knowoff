# Shared security headers snippet — `include`-d from *inside* every
# vhost's HTTPS `server {}` block (see the other files in this directory).
# Deliberately NOT auto-loaded by a `conf.d/*.conf` glob at the http level:
# nginx's `add_header` does not merge across nesting levels, so if this
# were loaded once at the http level, any vhost that sets its own
# `add_header` (e.g. a per-vhost Content-Security-Policy) would silently
# lose every header defined here. Including this file textually inside
# each server block keeps all headers in the same context, so they apply
# together. Aims for an A+/A++ securityheaders.com grade.
# HSTS is deliberately short-lived (5 minutes) in this dev config: the
# bundled certificate is self-signed (see ../entrypoint.sh), and a browser
# that has pinned HSTS for an untrusted cert can refuse to let you click
# through the warning *or* fall back to plain HTTP — a real local-dev
# lockout. Once you mount a real, trusted certificate under
# certs/external/ (see ../README.md), raise max-age to a production value
# (e.g. 63072000) and add `; preload`.
add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Cross-origin isolation headers. CORP is "same-site" (not "same-origin")
# because app./api./admin./adminer./minio.knowoff.local are different
# subdomains of one logical site that legitimately fetch from each other.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

# Every locked-down surface disables the permission set no browser feature
# in Knowoff needs; Poke's haptics use the Vibration API, which sites do
# not need explicit Permissions-Policy grants for.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
