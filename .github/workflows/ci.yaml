name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: all Go and Python checks with disposable integration services
        run: python3 xops/test/tests-lints.py --suite go --suite python --report-json validation-server.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-server
          path: validation-server.json
      - name: build server image
        run: cd server && docker build -t knowoffd:test .

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        run: cd client && flutter pub get
      - name: generate localizations
        run: cd client && flutter gen-l10n
      - name: Flutter tests and lint with skip accounting
        run: python3 xops/test/tests-lints.py --suite client --report-json validation-client.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-client
          path: validation-client.json
      - name: build Android
        run: cd client && flutter build apk --debug
      - name: build Web
        run: cd client && flutter build web
      - name: app size budget
        run: |
          cd client
          APK_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-debug.apk)
          echo "APK size: $APK_SIZE bytes"
          # Phase 1 budget: debug APK under 50 MB; release budget will be tighter.
          if [ "$APK_SIZE" -gt 52428800 ]; then
            echo "APK exceeds 50 MB budget"
            exit 1
          fi

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter pub get
        run: cd client && flutter pub get
      - name: generate localizations
        run: cd client && flutter gen-l10n
      - name: build iOS
        run: cd client && flutter build ios --no-codesign

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config check
        run: cd infra/compose && docker compose --profile core config > /dev/null
