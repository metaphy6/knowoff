# Private loopback prototype overlay; production mode flags stay disabled.
# Synthetic availability comes only from KNOWOFF_TEXT_PROTOTYPE_PACK.
app:
  env: local
server:
  bind_addr: 0.0.0.0
  port: 8080
  admin_addr: '0.0.0.0:9090'
  allowed_origins:
    - 'http://localhost:8001'
    - 'http://localhost:8002'
    - 'http://localhost:8003'
    - 'http://localhost:8004'
    - 'http://localhost:8005'
    - 'http://localhost:8006'
