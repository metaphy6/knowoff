# Base configuration for Knowoff.
# Every key must have a sane default. Secrets are ${VAR} references only.
# Environment overlays (local/staging/prod.yaml) override values; they must not introduce new keys unless base declares them.

app:
  name: knowoffd
  version: 0.1.0
  env: local  # overridden by overlay

log:
  level: info          # debug | info | warn | error
  format: json         # json for machine consumers; text for readable local output
  add_caller: false

server:
  # Public game server
  bind_addr: 0.0.0.0
  port: 8080
  read_timeout_s: 10
  write_timeout_s: 10
  idle_timeout_s: 120
  # Admin / internal operations server (never exposed through public ingress).
  # When admin_addr is non-empty it takes precedence over admin_bind_addr + admin_port.
  admin_addr: ":8081"
  admin_bind_addr: 127.0.0.1
  admin_port: 9090
  # Metrics port (separate from public traffic)
  metrics_bind_addr: 0.0.0.0
  metrics_port: 9091
  # Graceful shutdown window
  shutdown_grace_s: 15
  # Origins allowed for CORS. Empty disables CORS headers. Use ["*"] for dev.
  allowed_origins: []
  # Caps concurrent live WebSocket connections; the upgrade is rejected with
  # HTTP 503 once this many are open, so a burst of clients degrades
  # gracefully instead of exhausting host CPU/memory. Sized for a 16-core/
  # 30GB single-box home-server deployment (server container: ulimit -n
  # 65536, 8 CPUs, 8GB, see infra/compose/docker-compose.yaml), leaving fd
  # headroom for the DB/Redis pools and nginx's upstream legs. This is a
  # realistic single-box ceiling, not a path to "millions" of concurrent
  # players — that requires horizontal scaling (multiple server replicas
  # behind a load balancer with match/session state shared via Redis), a
  # separate architecture change. Lower this if running on smaller hardware.
  # 0 means unlimited.
  max_connections: 20000

websocket:
  max_message_bytes: 65536
  pong_wait_s: 60
  ping_period_s: 30
  write_wait_s: 10

protocol:
  # Active text wire; legacy clients are refused before admission.
  version: 2

# Frozen v2 policy; no mode is exposed before engine/content/client release gates.
# Runtime release certification is additionally required for each enabled cell.
text:
  version: 2
  rules_version: text-v1
  default_mode: missed_the_briefing
  compatibility:
    protocol_version: 2
    min_client_generation: 2
  modes:
    missed_the_briefing: {enabled: false, content_languages: []}
    secret_scale: {enabled: false, content_languages: []}
    make_room: {enabled: false, content_languages: []}
    bad_bargains: {enabled: false, content_languages: []}
    top_that: {enabled: false, content_languages: []}

# Owner-provided legal/support material; no placeholder enables authored data.
trust:
  user_terms_version: ""
  support_url: ""
  privacy_url: ""

localization:
  default_locale: en
  supported_locales:
    - en
  pseudo_locale_enabled: true  # CI gate uses pseudo-locale to catch hardcoded strings

# Free-chat moderation always applies English plus the sender's selected
# language. Add localized terms here; code never embeds a word list.
moderation:
  # Automated screening precedes human approval of contributor/challenge text.
  # To enable, overlay provider: openai and api_key from KNOWOFF_MODERATION_API_KEY.
  # Disabled or unreachable screening leaves entries pending; it never allows all.
  content_screening:
    provider: disabled
    model: omni-moderation-latest
    api_key: ""
    timeout_s: 10
  # Custom uploads remain unavailable until image screening is configured.
  avatar_upload_slots: 2
  avatar_screening:
    provider: disabled
    model: omni-moderation-latest
    api_key: ""
    timeout_s: 10
  default_language: en
  word_lists:
    en: [arse, arsehole, ass, asshole, bastard, bitch, bollocks, bullshit, crap, cunt, damn, dick, douchebag, fuck, fucker, fucking, fucks, goddamn, jackass, motherfucker, motherfucking, motherfucks, piss, pissed, pissing, prick, scumbag, shit, shits, shitting, shitty, slut, twat, wanker, whore]
    tr: [amk, amcik, bok, orospu, sik, siktir, yarrak]
    es: [cabron, coño, joder, mierda, puta, puto]
    de: [arsch, arschloch, bastard, scheisse, wichser]
    fr: [connard, merde, putain, salope]

database:
  driver: postgres
  host: postgres
  port: 5432
  name: knowoff
  user: knowoff
  password: ${KNOWOFF_DB_PASSWORD}
  ssl_mode: disable
  # Postgres is started with max_connections=200 (infra/compose); this pool
  # leaves headroom for adminer/migrate/seed-admin's own transient conns.
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_s: 1800

redis:
  addr: redis:6379
  password: ${KNOWOFF_REDIS_PASSWORD}
  db: 0
  pool_size: 50

security:
  dev_bot_key: ""                  # optional KNOWOFF_DEV_BOT_KEY; non-production prototype only
  jwt_signing_key: ${KNOWOFF_JWT_KEY}
  jwt_issuer: knowoff
  jwt_audience: knowoff-players
  access_token_ttl_m: 15
  refresh_token_ttl_h: 168
  bcrypt_cost: 10
  admin_totp_issuer: Knowoff Admin
  admin_session_ttl_h: 24
  oauth:
    trusted_proxy_cidrs: [] # Only actual reverse-proxy peers; forwarding is ignored by default.
    google:
      client_id: ""
      client_secret: ""
      redirect_url: ""
    facebook:
      client_id: ""
      client_secret: ""
      redirect_url: ""
      graph_version: "" # Explicit provider-reviewed version required before enabling.

rate_limit:
  enabled: true
  max_intents_per_second: 10
  max_intents_burst: 20
  max_bytes_per_frame: 65536

# Tunable gameplay constants live in gameplay/tuning.yaml and are merged under "tuning".

# Real billing stays closed until platform credentials and exact provider product
# IDs are supplied through a private overlay. These are bounded retry budgets.
billing:
  max_subscription_entries: 64
  max_receipt_bytes: 16384
  max_response_bytes: 262144
  http_timeout_s: 10
  task_poll_interval_s: 60
  task_batch_size: 20
  max_concurrent_requests: 4
  google:
    enabled: false
    package_name: ""
    service_account_email: ""
    private_key: ""
    allow_test_purchases: false
    products: {}
  apple:
    enabled: false
    bundle_id: ""
    app_apple_id: 0
    issuer_id: ""
    key_id: ""
    private_key: ""
    environment: Production
    products: {}

# Off until the exact AdMob callback identities and client consent journey exist.
rewarded_ads:
  enabled: false
  max_query_bytes: 16384
  max_response_bytes: 262144
  http_timeout_s: 10
  key_cache_s: 3600
  key_refresh_min_s: 60
  max_concurrent_requests: 4
  claim_ttl_s: 1800
  max_claims_per_match_window: 4
  ad_units: {}
