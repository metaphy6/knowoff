name: knowoff

# ── Resource limits ──────────────────────────────────────────────────────
# `deploy.resources.limits` is honored by `docker compose up` outside swarm
# mode (translated to `--cpus`/`--memory` on container create) and is the
# mechanism used below to size every service for a single dedicated home-
# server box: 16 cores / 30GiB RAM (see `nproc --all` / `free -h`). CPU
# limits are soft ceilings (not reservations — the kernel scheduler still
# time-shares idle cores), so the nominal sum across services can exceed 16
# without harm. Memory limits ARE hard (a container that exceeds its limit
# is OOM-killed), so the sum across services actually running together is
# kept well under 30GiB, leaving headroom for the host kernel/Docker daemon
# and any interactive use of this same box. Lower these if running on
# smaller hardware, or raise `server`'s once this box is a dedicated,
# headless home server with no other workload.

services:
  postgres:
    image: postgres:16-alpine
    # Tuned for the 3g memory limit below: shared_buffers ~25% of that,
    # effective_cache_size ~75% (a hint, not an allocation), max_connections
    # generous enough for the app pool (see database.max_open_conns in
    # configs/base.yaml) plus adminer/migrate/seed-admin's transient conns.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - log_line_prefix=%m [%p] [POSTGRES]
    env_file:
      - ./config/postgres/environment.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowoff -d knowoff"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 3g
    ports:
      - "127.0.0.1:5432:5432"
    profiles: [core, tools, test, edge]

  redis:
    image: redis:7-alpine
    env_file:
      - ./config/redis/environment.env
    # maxmemory matches the 1g limit below (with headroom for Redis's own
    # overhead); allkeys-lru evicts instead of erroring once full, so a
    # burst of concurrent sessions degrades gracefully rather than OOMing.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$KNOWOFF_REDIS_PASSWORD\" --maxmemory 768mb --maxmemory-policy allkeys-lru --loglevel notice --logfile \"\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$KNOWOFF_REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    ports:
      - "127.0.0.1:6379:6379"
    profiles: [core, tools, test, edge]

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    env_file:
      - ./config/minio/environment.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    profiles: [core, tools, test, edge]

  migrate:
    build:
      context: ../../server
      dockerfile: Dockerfile
    env_file:
      - ./config/migrate/environment.env
    volumes:
      - ../../configs:/app/configs:ro
      - ../../server/migrations:/migrations:ro
      - ../../content/packs:/data/packs:ro
      - ../../content/ingest:/data/ingest:ro
    entrypoint: ["/knowoffd", "migrate"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, tools, test, edge]

  # One-off dev login seeder — never starts with `up`; run explicitly via
  # Run directly with `docker compose --profile tools run --rm --build seed-admin`.
  # Overrides: KNOWOFF_SEED_ADMIN_EMAIL / _PASSWORD.
  seed-admin:
    build:
      context: ../../server
      dockerfile: Dockerfile
    env_file:
      - ./config/seed-admin/environment.env
    environment:
      - KNOWOFF_SEED_ADMIN_EMAIL
      - KNOWOFF_SEED_ADMIN_PASSWORD
    volumes:
      - ../../configs:/app/configs:ro
    entrypoint: ["/knowoffd", "seed-admin"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]

  server:
    build:
      context: ../../server
      dockerfile: Dockerfile.dev
    env_file:
      - ./config/server/environment.env
    environment:
      # GOMAXPROCS pins the scheduler to the cpus limit below instead of the
      # host's full core count. GOMEMLIMIT sets a soft heap target under the
      # hard memory limit so the GC works harder (not the OOM killer) as
      # concurrent connections/rooms push memory up.
      - GOMAXPROCS=8
      - GOMEMLIMIT=7000MiB
    volumes:
      - ../../server:/app
      - ../../configs:/app/configs:ro
      - ../../content/packs:/data/packs:ro
      - ../../content/ingest:/data/ingest:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8g
    # Docker's default of 1024 open files is the real ceiling on concurrent
    # WebSocket connections (one fd each) — well below server.max_connections
    # in configs/base.yaml. Raised so that config value is the actual cap.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: [core, tools, test, edge]

  adminer:
    image: adminer:4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [core, edge]

