  nginx:
    build:
      context: ../../nginx
      dockerfile: Dockerfile
    volumes:
      - ../../nginx/certs:/etc/nginx/certs
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w1 127.0.0.1 80 && nc -z -w1 127.0.0.1 443"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    # A proxied WebSocket holds 2 fds (client leg + upstream leg); Docker's
    # default of 1024 open files capped concurrency far below any of the
    # app-level limits. worker_rlimit_nofile in nginx.conf uses this headroom.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    depends_on:
      server:
        condition: service_healthy
      # client-web:
      #   condition: service_healthy
      adminer:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles: [core, edge]

