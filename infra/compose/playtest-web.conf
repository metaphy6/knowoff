# The Flutter bootstrap imports text_generation.mjs before loading the app.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Avoid retaining an earlier local test build after a rebuild.
    add_header Cache-Control "no-store" always;
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
