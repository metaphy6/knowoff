# Private disposable prototype, separate from the ordinary knowoff stack.
# No public ingress, production activation, seeded admin, or live credentials.
name: knowoff-playtest
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowoff
      POSTGRES_DB: knowoff
      POSTGRES_PASSWORD: ${KNOWOFF_DB_PASSWORD:?use make playtest.up}
    volumes:
      - playtest_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U knowoff -d knowoff']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    environment:
      KNOWOFF_REDIS_PASSWORD: ${KNOWOFF_REDIS_PASSWORD:?use make playtest.up}
    command: [sh, -c, 'exec redis-server --requirepass "$$KNOWOFF_REDIS_PASSWORD"']
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$KNOWOFF_REDIS_PASSWORD" redis-cli ping']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: ../../server
      dockerfile: Dockerfile
    image: knowoff-playtest-server:local
    environment: &runtime_environment
      KNOWOFF_CONFIG: configs/playtest.yaml
      KNOWOFF_DB_PASSWORD: ${KNOWOFF_DB_PASSWORD:?use make playtest.up}
      KNOWOFF_REDIS_PASSWORD: ${KNOWOFF_REDIS_PASSWORD:?use make playtest.up}
      KNOWOFF_JWT_KEY: ${KNOWOFF_JWT_KEY:?use make playtest.up}
    volumes:
      - ../../configs:/app/configs:ro
    command: [migrate]
    depends_on:
      postgres:
        condition: service_healthy
  server:
    image: knowoff-playtest-server:local
    build:
      context: ../../server
      dockerfile: Dockerfile
    environment:
      <<: *runtime_environment
      KNOWOFF_TEXT_PROTOTYPE_PACK: /prototype
    volumes:
      - ../../configs:/app/configs:ro
      - ../../server/pkg/media/testdata/text-en:/prototype:ro
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://127.0.0.1:8080/readyz']
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    image: nginx:alpine
    volumes:
      - ../../client/build/web:/usr/share/nginx/html:ro
      - ./playtest-web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8001:80'
      - '127.0.0.1:8002:80'
      - '127.0.0.1:8003:80'
      - '127.0.0.1:8004:80'
      - '127.0.0.1:8005:80'
      - '127.0.0.1:8006:80'
    depends_on:
      server:
        condition: service_healthy
volumes:
  playtest_pg:
